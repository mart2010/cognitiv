name: cognitiv_app
description: "App Cognitiv, assemble les paquets Dart purs (plateforme, jeux) et porte l interface."
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  cartographer:
    path: ../games/cartographer
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  workshop:
    path: ../games/workshop

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/sounds/
    - assets/maps/

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#4A7BD0"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
